<meta name="claude:viewport-fit-sides" content="cover">
<title>Rescatar a ROBI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra fija arriba (marca, 5 casilleros de letras, tiempo y pistas). Debajo, una pantalla por vez: inicio, mapa de salas con ROBI, cinco salas, palabra final. */
:root{
  --ink:#0B2545; --ink-2:#1B3C6B; --paper:#E8F0F6; --panel:#FFFFFF; --line:#C5D3E0; --dot:#CBD9E6; --muted:#4A6178;
  --robot:#D9480F; --robot-dk:#A93608; --robot-soft:#FFE6DA;
  --signal:#0A7F8C; --signal-soft:#D6F2F4; --sun:#FFC933;
  --ok:#16794A; --ok-soft:#D9F2E3; --bad:#B8283A; --bad-soft:#FBDDE1;
  --f-display:'Chakra Petch',system-ui,sans-serif; --f-body:'Atkinson Hyperlegible',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:22px 22px;color:var(--ink);font:400 17px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff;border-bottom:4px solid var(--sun)}
.hud-in{max-width:1100px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:auto 1fr auto;gap:12px 20px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--f-display);letter-spacing:.02em}
.led{width:12px;height:12px;border-radius:50%;background:#FF6B6B;box-shadow:0 0 0 3px rgba(255,107,107,.25)}
.led.up{background:#4ADE80;box-shadow:0 0 0 3px rgba(74,222,128,.25)}
.slots{display:flex;gap:8px;justify-content:center}
.slot{width:42px;height:50px;border:2px dashed #6E8DB1;border-radius:8px;display:grid;place-items:center;font:700 26px var(--f-display);color:#7F9BBB}
.slot.on{background:var(--sun);border:2px solid var(--sun);color:var(--ink);animation:pop .45s}
.stats{display:flex;gap:18px;align-items:center}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.stat b{font:700 22px var(--f-mono);font-variant-numeric:tabular-nums}
.stat small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#A9C0DA}
.timer.warn b{color:var(--sun)} .timer.crit b{color:#FF9A9A}
.gear{background:transparent;border:2px solid #5F7FA3;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
.gear:hover{background:var(--ink-2)}

.app{max-width:1100px;margin:0 auto;padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:20px}
.view[hidden]{display:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:10px;padding:10px 18px;font:700 16px var(--f-body);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(1px);box-shadow:0 3px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--robot);border-color:var(--robot-dk);color:#fff;box-shadow:0 4px 0 var(--robot-dk)}
.btn.primary:hover{box-shadow:0 3px 0 var(--robot-dk)} .btn.primary:active{box-shadow:0 0 0 var(--robot-dk)}
.btn.big{font-size:19px;padding:14px 26px}
.btn.small{padding:6px 12px;font-size:14px;box-shadow:0 3px 0 var(--ink)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-weight:700}

.panel{background:var(--panel);border:2px solid var(--ink);border-radius:14px;padding:22px}
.eyebrow{font:700 12px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--robot)}
.lead{font-size:19px;color:var(--ink-2)}
.story{border-left:6px solid var(--robot);padding-left:16px;font-size:19px}
.chip{display:inline-block;font:700 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;background:var(--signal-soft);color:var(--signal);padding:4px 10px;border-radius:999px}

/* Inicio */
.intro{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center}
.intro h1{font-size:clamp(34px,6vw,58px)}
.intro .rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.intro .rules li{display:flex;gap:12px;align-items:flex-start}
.intro .rules b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:700 14px var(--f-display)}
.field{display:grid;gap:6px}
.field label{font-weight:700}
.field input,.field select{border:2px solid var(--ink);border-radius:10px;padding:10px 12px;background:#fff;min-width:0}

/* ROBI */
.robi{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.robi [data-at]{opacity:.18;transition:opacity .5s,fill .5s}
.robi [data-at].on{opacity:1}
.robi .glitch{opacity:1;transition:opacity .4s} .robi .glitch.off{opacity:0}
.robi .static{animation:flick .9s steps(2) infinite}
.robi.happy{animation:bob 1.6s ease-in-out infinite}

/* Mapa */
.hub{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:22px;align-items:start}
.hub-robi{text-align:center;display:grid;gap:10px}
.meter{height:14px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%;background:var(--signal);transition:width .6s}
.rooms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.room-tile{text-align:left;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:14px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.room-tile:hover{transform:translateY(1px);box-shadow:0 3px 0 var(--ink)}
.room-tile .box{grid-row:span 2;width:54px;height:62px;border:2px dashed var(--muted);border-radius:8px;display:grid;place-items:center;font:700 32px var(--f-display);color:var(--muted)}
.room-tile[disabled]{opacity:.55;cursor:not-allowed;background:#EEF3F8;box-shadow:none;transform:none}
.room-tile.done{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.room-tile.done .box{background:var(--sun);border:2px solid var(--ink);color:var(--ink)}
.room-tile h3{font-size:18px}
.room-tile .sub{font-size:15px;color:var(--muted);grid-column:2}
.room-tile.fin{grid-column:1/-1;background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 0 var(--sun)}
.room-tile.fin .box{border-color:#7F9BBB;color:#7F9BBB}
.room-tile.fin .sub{color:#B9CCE3}
.room-tile.fin[disabled]{opacity:.55;cursor:not-allowed}

/* Salas */
.room-head{display:grid;gap:8px}
.room-head h2{font-size:clamp(26px,4.5vw,38px)}
.back{justify-self:start}
.hintbox{display:grid;gap:10px;background:var(--signal-soft);border:2px solid var(--signal);border-radius:12px;padding:14px}
.hintbox ol{margin:0;padding-left:22px;display:grid;gap:6px}
.hintbox .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hintbox .count{font-size:14px;color:var(--ink-2)}
.note{border-radius:10px;padding:12px 14px;font-weight:700}
.note.ok{background:var(--ok-soft);color:var(--ok)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.info{background:var(--signal-soft);color:var(--signal)}
.note p+p{margin-top:6px;font-weight:400;color:var(--ink)}
.section-title{font:700 14px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Sala 1 */
.folder{background:#F3F8FC;border:2px dashed var(--ink-2);border-radius:12px;padding:16px;display:grid;gap:12px}
.folder-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.folder-name{font:700 18px var(--f-mono)}
.cards8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.dcard{position:relative;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;display:grid;gap:4px;justify-items:center}
.dcard:hover{border-color:var(--ink)}
.dcard .em{font-size:44px;line-height:1.1}
.dcard .nm{font-weight:700;font-size:15px}
.dcard.sel{border-color:var(--bad);background:var(--bad-soft)}
.dcard.sel::after{content:"✕ intruso";position:absolute;top:-10px;right:-6px;background:var(--bad);color:#fff;font:700 12px var(--f-display);padding:2px 8px;border-radius:999px}
.dcard.gone{opacity:.25;filter:grayscale(1);pointer-events:none}
.confrow{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:15px}
.bar .track{height:16px;background:#E6EDF4;border-radius:999px;overflow:hidden;border:1.5px solid var(--line)}
.bar .fill{height:100%;background:var(--signal);transition:width .5s}
.bar .fill.bad{background:var(--bad)} .bar .fill.ok{background:var(--ok)} .bar .fill.mid{background:#C98A00}
.bar b{font-family:var(--f-mono);font-size:14px;text-align:right}

/* Sala 2 */
.dots{display:flex;flex-wrap:wrap;gap:4px;max-width:520px}
.dots i{width:16px;height:16px;border-radius:50%;background:#C62F3E;display:block}
.dots i.g{background:#5BA832;box-shadow:0 0 0 2px #fff,0 0 0 4px #5BA832;animation:pop .3s}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:50%;display:inline-block}
.tests{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tcard{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;justify-items:center;text-align:center;cursor:pointer}
.tcard:hover{border-color:var(--ink)}
.tcard.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--sun)}
.tcard svg{width:76px;height:76px}
.tcard .nm{font-weight:700;font-size:15px}
.tcard .res{font-size:14px;color:var(--muted)}
.slider{display:grid;gap:8px}
.slider input[type=range]{width:100%;accent-color:var(--robot);height:30px}
.slider .val{font:700 22px var(--f-mono)}

/* Sala 3 */
.tm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cls{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:12px;display:grid;gap:10px;align-content:start}
.cls header{display:flex;align-items:center;gap:10px;justify-content:space-between}
.cls .nm{font:700 18px var(--f-display);display:flex;gap:8px;align-items:center}
.cls .n{font:700 14px var(--f-mono);background:var(--paper);padding:2px 8px;border-radius:999px}
.conds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.conds .btn{font-size:13px;padding:6px 8px;box-shadow:0 2px 0 var(--ink)}
.thumbs{display:flex;flex-wrap:wrap;gap:4px;min-height:36px}
.thumbs span{width:32px;height:32px;border-radius:6px;background:#EEF3F8;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-size:20px}
.pic{display:inline-block;line-height:1}
.pic.frente{} .pic.costado{transform:scaleX(-1) skewY(-8deg)} .pic.lejos{transform:scale(.55)} .pic.pocaluz{filter:brightness(.35)} .pic.girado{transform:rotate(38deg)}
.test-zone{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.mystery{width:150px;height:150px;border:3px solid var(--ink);border-radius:14px;background:#EEF3F8;display:grid;place-items:center;font-size:78px;overflow:hidden}
.mystery.covered{background:repeating-linear-gradient(45deg,#CBD9E6 0 10px,#DCE7F0 10px 20px);font-size:60px;color:var(--ink-2)}
.mystery.dark{background:#1F2A38}

/* Sala 4 */
.q4{display:grid;gap:10px}
.item4{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.item4 .num{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font:700 16px var(--f-display);display:grid;place-items:center}
.item4 .em{font-size:26px;margin-right:8px}
.item4 .nm{font-weight:700}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 14px;font-weight:700;cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.item4.right{border-color:var(--ok);background:var(--ok-soft)} .item4.wrong{border-color:var(--bad);background:var(--bad-soft)}
.item4 .why{grid-column:1/-1;font-size:15px}
.abc{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px;overflow-x:auto}
.abc div{background:#fff;border:1.5px solid var(--line);border-radius:6px;text-align:center;padding:4px 0;min-width:30px;font-size:13px}
.abc b{display:block;font:700 16px var(--f-display)}
.letterin{width:90px;text-align:center;font:700 34px var(--f-display);text-transform:uppercase;border:3px solid var(--ink);border-radius:10px;padding:6px}

/* Sala 5 */
.dil{display:grid;gap:10px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:14px}
.dil h3{font-size:18px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt .k{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 15px var(--f-display)}
.opt.picked{border-color:var(--ink);background:#F3F8FC}
.opt.good{border-color:var(--ok);background:var(--ok-soft)} .opt.nogood{border-color:var(--bad);background:var(--bad-soft)}
.lock{display:grid;gap:14px;justify-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:20px}
.dials{display:flex;gap:12px}
.dial{display:grid;gap:6px;justify-items:center}
.dial button{width:56px;border:2px solid #7F9BBB;background:var(--ink-2);color:#fff;border-radius:8px;padding:2px 0;cursor:pointer}
.dial output{width:56px;height:64px;display:grid;place-items:center;background:#fff;color:var(--ink);border-radius:8px;font:700 36px var(--f-mono)}
.shake{animation:shake .4s}

/* Final y victoria */
.bank,.target{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:64px;height:76px;border:3px solid var(--ink);border-radius:10px;background:var(--sun);font:700 40px var(--f-display);cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.tile[disabled]{opacity:.25;cursor:default}
.hole{width:64px;height:76px;border:3px dashed var(--muted);border-radius:10px;display:grid;place-items:center;background:#fff}
.hole .tile{box-shadow:none}
.win{display:grid;gap:20px;text-align:center;justify-items:center}
.win h1{font-size:clamp(34px,6vw,56px)}
.facts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.fact{background:#fff;border:2px solid var(--ink);border-radius:12px;padding:10px 18px;min-width:130px}
.fact b{display:block;font:700 28px var(--f-mono)}
.fact small{color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.qs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;text-align:left;width:100%}
.qs .panel{padding:16px}

/* Ventanas */
.overlay{position:fixed;inset:0;background:rgba(11,37,69,.72);display:grid;place-items:center;padding:16px;z-index:50}
.overlay[hidden]{display:none}
.dialog{background:#fff;border:3px solid var(--ink);border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:24px;display:grid;gap:14px}
.dialog.center{text-align:center;justify-items:center}
.bigletter{width:110px;height:130px;background:var(--sun);border:4px solid var(--ink);border-radius:14px;font:700 84px var(--f-display);display:grid;place-items:center;animation:pop .6s}
table.key{border-collapse:collapse;width:100%;font-size:15px}
table.key th,table.key td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:60;font-weight:700;max-width:90vw}

@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes flick{0%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:820px){
  .hud-in{grid-template-columns:1fr auto}
  .slots{grid-column:1/-1;order:3}
  .intro,.hub,.test-zone{grid-template-columns:1fr}
  .tm{grid-template-columns:1fr}
  .qs{grid-template-columns:1fr}
  .cards8,.tests{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rooms{grid-template-columns:1fr}
  .item4{grid-template-columns:auto 1fr}
  .item4 .seg{grid-column:1/-1;justify-self:start}
  .bar{grid-template-columns:100px 1fr 46px}
  .mystery{width:120px;height:120px;font-size:60px}
}
</style>
<header class="hud" id="hud" hidden>
  <div class="hud-in">
    <div class="brand"><span class="led" id="led"></span><span>ROBI</span></div>
    <div class="slots" id="slots" aria-label="Letras conseguidas"></div>
    <div class="stats">
      <div class="stat timer" id="timerBox"><b id="timer">50:00</b><small id="timerLabel">Tiempo</small></div>
      <div class="stat"><b id="hintTotal">0</b><small>Pistas</small></div>
      <button class="gear" id="teacherBtn" type="button">Docente</button>
    </div>
  </div>
</header>

<main class="app" id="app">
  <section class="view" id="v-intro"></section>
  <section class="view" id="v-hub" hidden></section>
  <section class="view" id="v-room" hidden></section>
  <section class="view" id="v-final" hidden></section>
  <section class="view" id="v-win" hidden></section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" hidden></div>

<template id="robiSvg">
  <svg class="robi" viewBox="0 0 200 240" role="img" aria-label="ROBI, el robot de la escuela">
    <!-- antena -->
    <line x1="100" y1="30" x2="100" y2="52" stroke="#0B2545" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="24" r="9" fill="#9DB2C8" stroke="#0B2545" stroke-width="4"/>
    <circle cx="100" cy="24" r="9" fill="#FFC933" stroke="#0B2545" stroke-width="4" data-at="3"/>
    <!-- cabeza -->
    <rect x="38" y="52" width="124" height="98" rx="22" fill="#FFFFFF" stroke="#0B2545" stroke-width="5"/>
    <rect x="52" y="66" width="96" height="70" rx="12" fill="#0B2545"/>
    <!-- pantalla con fallas -->
    <g class="glitch static" data-until="5">
      <rect x="58" y="74" width="30" height="6" fill="#FF6B6B"/><rect x="104" y="84" width="38" height="6" fill="#4ADE80"/>
      <rect x="66" y="100" width="40" height="6" fill="#7FB4FF"/><rect x="92" y="118" width="46" height="6" fill="#FF6B6B"/>
      <text x="100" y="112" text-anchor="middle" font-family="Chakra Petch,monospace" font-weight="700" font-size="30" fill="#FFFFFF">?!</text>
    </g>
    <!-- ojos y boca que se arreglan -->
    <g data-at="1"><rect x="68" y="82" width="18" height="22" rx="6" fill="#5CE0EC"/></g>

/* ===== Sala 3: entrenar ===== */
function cnt(id) { return S.c3.counts[id] || (S.c3.counts[id] = { n: 0 }); }
function thumbs(id) {
  const c = cnt(id), a = ANIMALS.find(x => x.id === id), out = [];
  CONDS.forEach(k => { for (let i = 0; i < (c[k.id] || 0); i++) out.push('<span><i class="pic ' + k.id + '">' + a.em + '</i></span>'); });
  return out.join('');
}
function predict(snap) {
  const T = MYSTERY.truth, nT = (snap[T] && snap[T].n) || 0, cf = Math.min(1, nT / 15);
  const match = Math.min.apply(null, MYSTERY.conds.map(k => Math.min(1, ((snap[T] && snap[T][k]) || 0) / 3)));
  const t = 0.08 + 0.92 * cf * (0.4 + 0.6 * match);
  const others = ANIMALS.filter(a => a.id !== T), sum = others.reduce((s, a) => s + ((snap[a.id] && snap[a.id].n) || 0), 0), p = {};
  others.forEach(a => { const share = sum ? ((snap[a.id] && snap[a.id].n) || 0) / sum : 1 / others.length; p[a.id] = Math.round((1 - t) * share * 100); });
  p[T] = 100 - others.reduce((s, a) => s + p[a.id], 0);
  return { p: p, cf: cf, match: match };
}
function bodyC3() {
  const c = S.c3, snapNow = JSON.stringify(c.counts);

      '<div class="thumbs">' + thumbs(a.id) + '</div>' +
      '<button class="link" id="reset-' + a.id + '" data-act="c3-reset" data-a="' + a.id + '" style="justify-self:start;font-size:14px">Borrar ejemplos</button></div>';
  }).join('');
  const trainedNote = !c.trained ? '' : (JSON.stringify(c.trained) === snapNow ? '<span class="chip">Modelo entrenado</span>' : '<span class="chip" style="background:var(--robot-soft);color:var(--robot-dk)">Cambiaron los ejemplos: entrená de nuevo</span>');
  const covered = c.covered;
  const mys = covered ? '<div class="mystery covered" aria-label="Objeto tapado">?</div>' :
    '<div><div class="mystery' + (MYSTERY.conds.includes('pocaluz') ? ' dark' : '') + '"><i class="pic ' + MYSTERY.conds.join(' ') + '">' + ANIMALS.find(a => a.id === MYSTERY.truth).em + '</i></div></div>';

    return '<div class="dil"><h3>Situación ' + (i + 1) + '</h3><p>' + esc(d.q) + '</p><div class="opts">' + opts + '</div>' + fb + '</div>';
  }).join('');
  const dials = c.code.map((v, j) => '<div class="dial"><button id="up-' + j + '" data-act="c5-dial" data-j="' + j + '" data-s="1" aria-label="Subir número ' + (j + 1) + '">▲</button><output aria-label="Número ' + (j + 1) + '">' + v + '</output><button id="dn-' + j + '" data-act="c5-dial" data-j="' + j + '" data-s="-1" aria-label="Bajar número ' + (j + 1) + '">▼</button></div>').join('');
  const lm = c.msg ? '<div class="note ' + c.msg.k + '" style="width:100%">' + c.msg.h + '</div>' : '';
  const out = '<div class="dil" style="gap:12px"><h3>Cofre de ROBI</h3><p>Cada opción tiene un número. El código es el número de la opción correcta de cada situación, en orden.</p>' +
    '<div class="lock' + (shakeLock ? ' shake' : '') + '"><span class="section-title" style="color:#A9C0DA">Código de 3 números</span><div class="dials">' + dials + '</div>' +
    '<button class="btn primary" id="c5-open" data-act="c5-open"' + (S.solved.c5 ? ' disabled' : '') + '>Abrir el cofre</button></div>' + lm + '<p style="font-size:14px;color:var(--muted)">Cada código equivocado suma 30 segundos al reloj.</p></div>';
  shakeLock = false;
  return dil + out;
}
function actC5(a, d) {
  const c = S.c5; delete c.msg;
  if (a === 'c5-pick') c.pick[d.d] = +d.k;
  if (a === 'c5-dial') c.code[+d.j] = (c.code[+d.j] + +d.s + 10) % 10;
  if (a === 'c5-open') {
    if (c.code.join('-') === lockCode().join('-')) { c.msg = { k: 'ok', h: '<p>Se abrió el cofre.</p>' }; save(); rerender(); return solve('c5'); }
    c.tries++; shakeLock = true; c.msg = { k: 'bad', h: 'El código no es correcto. Resuelvan las tres situaciones y busquen el número de la opción buena.' };
    addPenalty(LOCK_PENALTY_MS, 'código equivocado');
  }
  save(); rerender();
}
/* ===== Final: palabra clave ===== */
function renderFinal() {
  const f = S.fin, used = f.slots;
  const bank = shuffled(S.letters.map((_, i) => i), S.seed).map(i => { const l = S.letters[i]; return '<button class="tile" id="bank-' + i + '" data-act="fin-place" data-i="' + i + '"' + (used.includes(i) ? ' disabled' : '') + ' aria-label="Letra ' + l + '">' + l + '</button>'; }).join('');
  const holes = WORD.split('').map((_, p) => '<div class="hole">' + (used[p] !== undefined ? '<button class="tile" id="slot-' + p + '" data-act="fin-remove" data-p="' + p + '" aria-label="Quitar letra ' + S.letters[used[p]] + '">' + S.letters[used[p]] + '</button>' : '') + '</div>').join('');
  const full = used.length === WORD.length;
  $('#v-final').innerHTML = '<button class="btn small back" id="back" data-act="to-hub">← Volver al mapa</button>' +
    '<div class="room-head"><span class="chip" style="justify-self:start">Último paso</span><h2>Reiniciar a ROBI</h2><p class="story">Ordenen las 5 letras para formar la palabra clave. Pista: es lo que una inteligencia artificial necesita para aprender.</p></div>' +
    '<div class="panel" style="display:grid;gap:20px;justify-items:center"><div style="width:150px">' + robi(5) + '</div>' +
    '<div class="target" aria-label="Palabra clave">' + holes + '</div>' +
    '<span class="section-title">Letras conseguidas</span><div class="bank">' + bank + '</div>' +
    (f.msg ? '<div class="note bad">' + f.msg + '</div>' : '') +
    '<button class="btn primary big" id="fin-check" data-act="fin-check"' + (full ? '' : ' disabled') + '>Reiniciar a ROBI</button></div>' + hintBox('fin');
}
function actFin(a, d) {
  const f = S.fin; delete f.msg;
  if (a === 'fin-place') { if (!f.slots.includes(+d.i) && f.slots.length < WORD.length) f.slots.push(+d.i); }
  if (a === 'fin-remove') f.slots.splice(+d.p, 1);
  if (a === 'fin-check') {
    const w = f.slots.map(i => S.letters[i]).join('');
    if (w === WORD) { S.finishedAt = Date.now(); save(); return go('win'); }
    f.tries++; f.msg = 'ROBI sigue sin reiniciarse. Esa palabra no es la clave. Prueben otro orden.';
  }
  save(); rerender();
}

/* ===== Victoria ===== */
function renderWin() {
  const total = Object.values(S.hints).reduce((a, b) => a + b, 0) + S.finalHints;
  const ms = (S.finishedAt || Date.now()) - S.startedAt + S.penaltyMs;
  $('#v-win').innerHTML = '<div class="win"><span class="eyebrow">Misión cumplida</span><h1>¡ROBI está de vuelta!</h1>' +
    '<div style="width:230px">' + robi(5, true) + '</div>' +
    '<p class="lead">Equipo <b>' + esc(S.team) + '</b>, arreglaron su entrenamiento con <b>DATOS</b> mejores. Sin buenos datos, una IA no puede aprender bien.</p>' +
    '<div class="facts"><div class="fact"><b>' + fmt(ms) + '</b><small>Tiempo total</small></div><div class="fact"><b>' + total + '</b><small>Pistas usadas</small></div><div class="fact"><b>5/5</b><small>Salas resueltas</small></div></div>' +
    '<h2>Para conversar en equipo</h2><div class="qs">' + CLOSING_QS.map(q => '<div class="panel"><p><b>' + esc(q) + '</b></p></div>').join('') + '</div>' +
    '<div class="panel" style="text-align:left;width:100%"><span class="eyebrow">Desafío bonus</span><p style="margin-top:6px">' + esc(BONUS) + '</p></div>' +
    '<button class="btn" id="again" data-act="again">Jugar de nuevo</button></div>';
}

/* ===== Panel docente ===== */
function teacherGate() {
  openDialog('<h2>Panel docente</h2><p>Escribí el PIN para continuar.</p><div class="field"><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off"></div>' +
    '<div class="actions"><button class="btn primary" id="pin-ok" data-act="pin-ok">Entrar</button><button class="btn ghost" data-act="close">Cerrar</button></div><div id="pin-msg"></div>');
}
function teacherPanel() {
  const code = lockCode().join(' - ');
  openDialog('<h2>Panel docente</h2><table class="key"><tr><th>Sala</th><th>Respuesta</th></tr>' +
    '<tr><td>Intruso (D)</td><td>Murciélago y mariposa. El pingüino sí es pájaro.</td></tr>' +
    '<tr><td>Manzanas (A)</td><td>Manzana verde. Hay que llegar a 12 fotos verdes o más.</td></tr>' +
    '<tr><td>Entrenar (T)</td><td>12 fotos de conejo o más, con 3 de costado y 3 con poca luz.</td></tr>' +
    '<tr><td>IA o no IA (O)</td><td>Usan IA las tarjetas 2, 3, 4 y 6. 2+3+4+6 = 15, la letra O.</td></tr>' +
    '<tr><td>Ética (S)</td><td>Código de esta partida: ' + code + '</td></tr>' +
    '<tr><td>Final</td><td>DATOS</td></tr></table>' +
    '<div class="field"><label for="mins">Tiempo total (minutos)</label><input id="mins" type="number" min="5" max="120" value="' + Math.round(S.durationMs / 60000) + '"></div>' +
    '<div class="actions"><button class="btn" id="t-set" data-act="time-set">Cambiar tiempo</button>' +
    (S.startedAt ? '<button class="btn" id="t-add" data-act="time-add">Sumar 5 minutos</button><button class="btn" id="t-reset" data-act="reset">Reiniciar juego</button>' : '') +
    '<button class="btn ghost" data-act="close">Cerrar</button></div>');
}

/* ===== Eventos ===== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'start') return startGame();
  if (a === 'resume') { const o = load(); if (o) { S = o; go(S.finishedAt ? 'win' : S.view === 'intro' ? 'hub' : S.view, S.room); } return; }
  if (a === 'close') return closeDialog();
  if (a === 'teacher') return teacherGate();
  if (a === 'to-hub') { closeDialog(); return go('hub'); }
  if (a === 'room') return go('room', d.id);
  if (a === 'final') return go('final');
  if (a === 'hint') return askHint(d.key);
  if (a === 'mark' || a === 'clean') return actC1(a, d.id);
  if (a === 'pick-test' || a === 'retrain' || a === 'c2-add') return actC2(a, d.id);
  if (a.startsWith('c3-')) return actC3(a, d);
  if (a.startsWith('c4-')) return actC4(a, d);
  if (a.startsWith('c5-')) return actC5(a, d);
  if (a.startsWith('fin-')) return actFin(a, d);
  if (a === 'again') { wipe(); S = newState(); return go('intro'); }
  if (a === 'pin-ok') { if ($('#pin').value === TEACHER_PIN) teacherPanel(); else $('#pin-msg').innerHTML = '<div class="note bad">PIN incorrecto.</div>'; return; }
  if (a === 'time-set') {
    const m = Math.min(120, Math.max(5, parseInt($('#mins').value, 10) || DEFAULT_MINUTES)); S.durationMs = m * 60000; save(); tick(); closeDialog(); return toast('Tiempo total: ' + m + ' minutos.');
  }
  if (a === 'time-add') { S.durationMs += 5 * 60000; S.overtime = false; save(); tick(); closeDialog(); return toast('Se sumaron 5 minutos.'); }
  if (a === 'reset') { wipe(); S = newState(); closeDialog(); return go('intro'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'gslider') { S.c2.g = +e.target.value; updateC2Live(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'team') startGame();
  if (e.target.id === 'pin') $('#pin-ok').click();
});
$('#teacherBtn').addEventListener('click', teacherGate);

/* ===== Arranque ===== */
go('intro');
</script>
